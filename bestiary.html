<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiary - 山海经</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1a1a1a;
            --primary-light: #f8f6f0;
            --accent-gold: #c4a572;
            --sage-green: #8b9a8b;
            --common: #6b6b6b;
            --rare: #4a7c59;
            --epic: #7c4a7c;
            --legendary: #b8860b;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: var(--primary-light);
            overflow-x: hidden;
        }
        
        .title-font {
            font-family: 'Noto Serif SC', serif;
        }
        
        .mystical-font {
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        .creature-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .creature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-gold);
        }
        
        .creature-card.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .creature-card.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .creature-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }
        
        .rarity-common { border-left: 4px solid var(--common); }
        .rarity-rare { border-left: 4px solid var(--rare); }
        .rarity-epic { border-left: 4px solid var(--epic); }
        .rarity-legendary { border-left: 4px solid var(--legendary); }
        
        .filter-button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: var(--primary-light);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .filter-button:hover, .filter-button.active {
            background: var(--accent-gold);
            color: white;
            border-color: var(--accent-gold);
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background: var(--primary-light);
            color: var(--primary-dark);
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        
        .modal.active .modal-content {
            transform: scale(1);
        }
        
        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }
        
        .nav-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        
        .nav-item {
            flex: 1;
            padding: 16px;
            text-align: center;
            color: var(--primary-light);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }
        
        .nav-item:hover, .nav-item.active {
            color: var(--accent-gold);
            background: rgba(196, 165, 114, 0.1);
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold) 0%, #8b6914 100%);
            transition: width 0.5s ease;
        }
        
        .search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--primary-light);
            width: 100%;
            font-size: 16px;
        }
        
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-gold);
        }
        
        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }
        
        .close-button {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .close-button:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.1);
        }
        
        .lore-section {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 8px;
        }
        
        .lore-section::-webkit-scrollbar {
            width: 4px;
        }
        
        .lore-section::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 2px;
        }
        
        .lore-section::-webkit-scrollbar-thumb {
            background: var(--accent-gold);
            border-radius: 2px;
        }
        
        .achievement-badge {
            display: inline-block;
            background: var(--accent-gold);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin: 4px 4px 4px 0;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 0 20px;
        }
        
        @media (max-width: 640px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
                padding: 0 12px;
            }
            
            .creature-image {
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="py-8 px-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="title-font text-4xl md:text-5xl font-bold text-center text-white mb-4">
                Bestiary
            </h1>
            <p class="text-center text-gray-400 text-lg mb-8">
                Your collection of mystical creatures from the Shan Hai Jing
            </p>
            
            <!-- Search Bar -->
            <div class="mb-6">
                <input type="text" id="search-input" class="search-input" placeholder="Search creatures by name or type...">
            </div>
            
            <!-- Filters -->
            <div class="flex flex-wrap gap-3 mb-8 justify-center">
                <button class="filter-button active" data-filter="all">All</button>
                <button class="filter-button" data-filter="common">Common</button>
                <button class="filter-button" data-filter="rare">Rare</button>
                <button class="filter-button" data-filter="epic">Epic</button>
                <button class="filter-button" data-filter="legendary">Legendary</button>
            </div>
            
            <!-- Progress Stats -->
            <div class="mb-8">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm text-gray-400">Collection Progress</span>
                    <span class="text-sm text-gray-400" id="progress-text">0/15</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-unique">0</div>
                    <div class="stat-label">Unique</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="common-count">0</div>
                    <div class="stat-label">Common</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="rare-count">0</div>
                    <div class="stat-label">Rare</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="epic-count">0</div>
                    <div class="stat-label">Epic</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="legendary-count">0</div>
                    <div class="stat-label">Legendary</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Creatures Grid -->
    <main class="pb-24">
        <div class="grid-container" id="creatures-grid">
            <!-- Creatures will be populated by JavaScript -->
        </div>
    </main>

    <!-- Creature Detail Modal -->
    <div class="modal" id="creature-modal">
        <div class="modal-content">
            <button class="close-button" id="close-modal">&times;</button>
            <img class="modal-image" id="modal-image" src="" alt="">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="title-font text-2xl font-bold mb-2" id="modal-name"></h2>
                        <span class="text-sm px-3 py-1 rounded-full text-white" id="modal-rarity"></span>
                    </div>
                </div>
                
                <div class="mb-4">
                    <h3 class="font-semibold mb-2">Symbolic Meaning</h3>
                    <p class="text-gray-600" id="modal-symbolism"></p>
                </div>
                
                <div class="mb-4">
                    <h3 class="font-semibold mb-2">Ancient Lore</h3>
                    <div class="lore-section text-gray-600" id="modal-lore"></div>
                </div>
                
                <div class="mb-4">
                    <h3 class="font-semibold mb-2">Discovery Info</h3>
                    <div class="text-sm text-gray-500" id="modal-discovery"></div>
                </div>
                
                <div class="flex flex-wrap gap-2" id="modal-achievements">
                    <!-- Achievement badges will be added here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="nav-bottom">
        <div class="flex">
            <a href="index.html" class="nav-item">
                <div class="text-lg mb-1">🎴</div>
                <div>Draw</div>
            </a>
            <a href="bestiary.html" class="nav-item active">
                <div class="text-lg mb-1">📚</div>
                <div>Bestiary</div>
            </a>
        </div>
    </nav>

    <script src="main.js"></script>
</body>
</html>
