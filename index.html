<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>VoxelCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pf:'VT323',monospace;
  --pt:'Press Start 2P',monospace;
  --ui:#000000b8;
  --bdr:rgba(255,255,255,.18);
  --gold:#ffd700;
  --green:#3d8f3d;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{font-family:var(--pf)}
#c{display:block;width:100vw;height:100vh;cursor:crosshair}

/* ── Loading ── */
#loading{position:fixed;inset:0;z-index:9999;background:#0a0a0a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#loading h1{font-family:var(--pt);font-size:clamp(16px,4vw,34px);color:var(--green);
  text-shadow:3px 3px #000,0 0 40px var(--green)}
#load-bar-outer{width:260px;height:14px;border:2px solid #444;border-radius:2px;background:#111;overflow:hidden}
#load-bar{height:100%;width:0;background:linear-gradient(90deg,#2a6e2a,#6abf6a);transition:width .25s}
#load-msg{font-size:16px;color:#888;font-family:monospace}

/* ── HUD ── */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;user-select:none}

/* crosshair */
#xhair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px}
#xhair::before,#xhair::after{content:'';position:absolute;background:rgba(255,255,255,.85)}
#xhair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#xhair::after{width:100%;height:2px;top:50%;transform:translateY(-50%)}

/* time */
#time-hud{position:absolute;top:12px;right:12px;background:var(--ui);border:1px solid var(--bdr);
  padding:5px 12px;border-radius:4px;font-size:17px;color:#fff;display:flex;align-items:center;gap:8px}
#t-icon{font-size:19px}

/* debug */
#dbg{position:absolute;top:12px;left:12px;background:var(--ui);border:1px solid var(--bdr);
  padding:5px 10px;border-radius:4px;font-size:12px;color:rgba(255,255,255,.6);
  line-height:1.7;font-family:monospace;display:none}

/* health / hotbar */
#bars{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:3px}
#hp-row{display:flex;gap:3px}
.heart{font-size:16px;filter:drop-shadow(1px 1px 0 #000)}

#hotbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;background:var(--ui);border:1px solid var(--bdr);
  padding:4px;border-radius:6px;pointer-events:auto}
.hslot{width:52px;height:52px;border:2px solid rgba(255,255,255,.22);border-radius:4px;
  background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;position:relative;transition:border-color .08s,background .08s}
.hslot:hover{background:rgba(255,255,255,.09)}
.hslot.on{border-color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 8px rgba(255,255,255,.12)}
.hslot .sc{position:absolute;bottom:2px;right:4px;font-size:10px;color:#fff;
  text-shadow:1px 1px 0 #000;font-family:monospace;pointer-events:none}
.hslot .sn{position:absolute;top:1px;left:3px;font-size:9px;color:rgba(255,255,255,.4);font-family:monospace}

/* break bar */
#bkwrap{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
  width:130px;height:7px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden;
  border:1px solid rgba(255,255,255,.15);display:none}
#bkfill{height:100%;width:0;background:linear-gradient(90deg,#e05020,#ffd700);transition:width .04s linear}

/* tooltip */
#ttip{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);
  background:var(--ui);border:1px solid var(--bdr);padding:3px 10px;border-radius:4px;
  font-size:15px;color:#fff;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}

/* damage overlay */
#dmg{position:absolute;inset:0;pointer-events:none;background:transparent;transition:background .25s}

/* toast */
#toast{position:absolute;top:18%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.2);
  padding:7px 18px;border-radius:20px;font-size:16px;color:#fff;white-space:nowrap;
  opacity:0;transition:opacity .35s;pointer-events:none}

/* ── Screens ── */
.screen{position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px}

#death-scr{background:rgba(160,0,0,.75);backdrop-filter:blur(5px)}
#death-scr h1{font-family:var(--pt);font-size:clamp(20px,5vw,46px);color:#fff;text-shadow:3px 3px #000}
#death-scr p{font-size:18px;color:rgba(255,255,255,.8)}

#pause-scr{background:rgba(0,0,0,.6);backdrop-filter:blur(7px)}
#pause-scr h1{font-family:var(--pt);font-size:clamp(16px,4vw,36px);color:#fff}

.gbtn{font-family:var(--pt);font-size:clamp(8px,2vw,13px);padding:10px 28px;cursor:pointer;
  background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:4px;
  letter-spacing:1px;transition:background .15s,transform .1s;pointer-events:auto}
.gbtn:hover{background:rgba(255,255,255,.25);transform:scale(1.04)}
.gbtn:active{transform:scale(.97)}
.gbtn.g{border-color:var(--green);color:#6abf6a}
.gbtn.g:hover{background:rgba(61,143,61,.3)}

/* ── Inventory ── */
#inv-scr{background:rgba(0,0,0,.82);backdrop-filter:blur(8px);pointer-events:auto}
#inv-panel{background:rgba(16,16,16,.97);border:1px solid rgba(255,255,255,.18);border-radius:10px;
  padding:20px 22px;width:min(530px,96vw);max-height:90vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px}
#inv-panel::-webkit-scrollbar{width:5px}
#inv-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
#inv-panel h2{font-family:var(--pt);font-size:clamp(9px,2vw,13px);color:#fff;text-align:center;letter-spacing:2px}
.isec{display:flex;flex-direction:column;gap:6px}
.ilbl{font-size:14px;color:rgba(255,255,255,.45);letter-spacing:1px}
.sgrid{display:flex;flex-wrap:wrap;gap:4px}
.islot{width:46px;height:46px;border:1px solid rgba(255,255,255,.22);border-radius:4px;
  background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  font-size:21px;cursor:pointer;position:relative;transition:border-color .1s,background .1s;flex-shrink:0}
.islot:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.08)}
.islot.sel{border-color:var(--gold);background:rgba(255,215,0,.12)}
.islot .sc{position:absolute;bottom:2px;right:3px;font-size:10px;color:#fff;
  text-shadow:1px 1px 0 #000;font-family:monospace;pointer-events:none}

/* crafting */
#craft-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
#cgrid-hold{display:flex;flex-direction:column;gap:4px}
.cgrow{display:flex;gap:4px}
.carrow{font-size:26px;color:rgba(255,255,255,.55)}
#cresult{width:54px;height:54px;border:2px solid var(--gold);border-radius:6px;
  background:rgba(255,215,0,.07);display:flex;align-items:center;justify-content:center;
  font-size:25px;cursor:pointer;position:relative;transition:background .15s,transform .1s}
#cresult:hover{background:rgba(255,215,0,.22);transform:scale(1.06)}
#cresult.empty{border-color:rgba(255,255,255,.2);cursor:default}
#cresult .sc{position:absolute;bottom:3px;right:4px;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000;font-family:monospace}
#craft-info{font-size:12px;color:rgba(255,255,255,.3);text-align:center;font-family:monospace}
#craft-clear{align-self:center;font-size:13px;padding:4px 14px}

/* ── Touch Controls ── */
#tui{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#joy-zone{position:absolute;left:14px;bottom:16px;width:148px;height:148px;pointer-events:auto}
#joy-base{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2)}
#joy-nub{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.22);
  border:2px solid rgba(255,255,255,.5);left:47px;top:47px}
#cam-zone{position:absolute;right:216px;bottom:16px;width:128px;height:128px;pointer-events:auto}
#cam-base{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15)}
#cam-nub{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);
  border:2px solid rgba(255,255,255,.35);left:42px;top:42px}
#apad{position:absolute;right:8px;bottom:8px;width:208px;height:208px;pointer-events:auto}
.tbtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;border:2px solid rgba(255,255,255,.4);text-shadow:1px 1px 2px #000;
  user-select:none;-webkit-user-select:none;pointer-events:auto;cursor:pointer;
  transition:filter .1s;font-family:monospace;font-weight:bold}
.tbtn:active{filter:brightness(2)}
#tj{width:64px;height:64px;background:rgba(50,180,50,.55);right:12px;bottom:108px;font-size:22px}
#tb{width:58px;height:58px;background:rgba(220,55,55,.55);right:88px;bottom:26px;font-size:20px}
#tp{width:58px;height:58px;background:rgba(50,90,220,.55);right:12px;bottom:26px;font-size:20px}
#ti{width:48px;height:48px;background:rgba(180,120,20,.55);right:156px;bottom:78px;font-size:17px}
#ta{width:52px;height:52px;background:rgba(200,50,200,.55);right:84px;bottom:112px;font-size:18px}

@media(max-width:768px){
  #bars{bottom:245px}#hotbar{bottom:192px}#bkwrap{bottom:228px}#ttip{bottom:238px}
  .hslot{width:44px;height:44px;font-size:19px}#dbg{display:none!important}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Loading -->
<div id="loading">
  <h1>⛏ VoxelCraft</h1>
  <div id="load-bar-outer"><div id="load-bar"></div></div>
  <p id="load-msg">Initializing…</p>
</div>

<!-- HUD -->
<div id="hud">
  <div id="xhair"></div>
  <div id="dbg"></div>
  <div id="time-hud"><span id="t-icon">☀️</span><span id="t-lbl">Day</span></div>
  <div id="bars"><div id="hp-row"></div></div>
  <div id="hotbar"></div>
  <div id="bkwrap"><div id="bkfill"></div></div>
  <div id="ttip"></div>
  <div id="dmg"></div>
  <div id="toast"></div>
</div>

<!-- Screens -->
<div id="death-scr" class="screen">
  <h1>💀 You Died!</h1>
  <p id="death-msg">Slain by a zombie</p>
  <button class="gbtn g" id="btn-resp">Respawn</button>
</div>
<div id="pause-scr" class="screen">
  <h1>⏸ Paused</h1>
  <p style="font-size:14px;color:#aaa;font-family:monospace">Press Esc or click to resume</p>
  <button class="gbtn g" id="btn-resume">▶ Resume</button>
</div>

<!-- Inventory -->
<div id="inv-scr" class="screen">
  <div id="inv-panel">
    <h2>🎒 Inventory &amp; Crafting</h2>
    <div class="isec">
      <div class="ilbl">✦ Crafting</div>
      <div id="craft-wrap">
        <div id="cgrid-hold"></div>
        <div class="carrow">▶</div>
        <div id="cresult" class="empty"></div>
      </div>
      <div id="craft-info">Select an item below, then click a crafting slot</div>
      <button class="gbtn craft-clear" id="btn-craft-clear">Clear Grid</button>
    </div>
    <div class="isec">
      <div class="ilbl">✦ Inventory (27 slots)</div>
      <div id="inv-main" class="sgrid"></div>
    </div>
    <div class="isec">
      <div class="ilbl">✦ Hotbar</div>
      <div id="inv-hbar" class="sgrid"></div>
    </div>
    <button class="gbtn" id="btn-inv-close" style="align-self:center">Close [E]</button>
  </div>
</div>

<!-- Touch UI -->
<div id="tui">
  <div id="joy-zone"><div id="joy-base"></div><div id="joy-nub"></div></div>
  <div id="cam-zone"><div id="cam-base"></div><div id="cam-nub"></div></div>
  <div id="apad">
    <div class="tbtn" id="tj">↑</div>
    <div class="tbtn" id="tb">⛏</div>
    <div class="tbtn" id="tp">🧱</div>
    <div class="tbtn" id="ti">🎒</div>
    <div class="tbtn" id="ta">⚔</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</body>
</html>
