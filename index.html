<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>VoxelCraft</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --pf:'VT323',monospace;
  --pt:'Press Start 2P',monospace;
  --ui:rgba(0,0,0,0.75);
  --bdr:rgba(255,255,255,0.2);
  --gold:#ffd700;
  --green:#3d8f3d;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:var(--pf)}

/* ── Canvas fills screen ── */
#c{display:block;width:100vw;height:100vh;cursor:crosshair}

/* ── Loading Screen ── */
#loading{
  position:fixed;inset:0;z-index:9999;background:#0a0a0a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px
}
#loading h1{
  font-family:var(--pt);font-size:clamp(13px,3.5vw,30px);color:var(--green);
  text-shadow:3px 3px #000,0 0 30px var(--green);text-align:center
}
#load-bar-outer{width:min(260px,70vw);height:13px;border:2px solid #444;border-radius:2px;background:#111;overflow:hidden}
#load-bar{height:100%;width:0;background:linear-gradient(90deg,#2a6e2a,#6abf6a);transition:width .2s}
#load-msg{font-size:15px;color:#777;font-family:monospace}

/* ── HUD (always pointer-events:none except hotbar) ── */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;user-select:none}

/* Crosshair */
#xhair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px}
#xhair::before,#xhair::after{content:'';position:absolute;background:rgba(255,255,255,0.9)}
#xhair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#xhair::after{width:100%;height:2px;top:50%;transform:translateY(-50%)}

/* Time - top right */
#time-hud{
  position:absolute;top:8px;right:10px;
  background:var(--ui);border:1px solid var(--bdr);
  padding:4px 10px;border-radius:4px;font-size:16px;color:#fff;
  display:flex;align-items:center;gap:6px
}

/* Debug - top left */
#dbg{
  position:absolute;top:8px;left:10px;
  background:var(--ui);border:1px solid var(--bdr);
  padding:4px 8px;border-radius:4px;font-size:11px;
  color:rgba(255,255,255,0.6);line-height:1.7;font-family:monospace;display:none
}

/* Health - top center */
#bars{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  background:var(--ui);border:1px solid var(--bdr);
  padding:4px 10px;border-radius:4px;display:flex;gap:2px
}
.heart{font-size:13px;filter:drop-shadow(1px 1px 0 #000)}

/* Hotbar - bottom center */
#hotbar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;background:var(--ui);border:1px solid var(--bdr);
  padding:4px;border-radius:6px;pointer-events:auto
}
.hslot{
  width:48px;height:48px;border:2px solid rgba(255,255,255,0.22);border-radius:4px;
  background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;position:relative;
  transition:border-color .08s,background .08s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent
}
.hslot.on{border-color:#fff;background:rgba(255,255,255,0.16);box-shadow:inset 0 0 8px rgba(255,255,255,0.15)}
.hslot:active{filter:brightness(1.5)}
.hslot .sc{position:absolute;bottom:1px;right:3px;font-size:9px;color:#fff;text-shadow:1px 1px 0 #000;font-family:monospace;pointer-events:none}
.hslot .sn{position:absolute;top:1px;left:3px;font-size:8px;color:rgba(255,255,255,0.4);font-family:monospace}

/* Break progress bar - above hotbar */
#bkwrap{
  position:absolute;bottom:62px;left:50%;transform:translateX(-50%);
  width:120px;height:7px;background:rgba(0,0,0,0.55);border-radius:3px;
  overflow:hidden;border:1px solid rgba(255,255,255,0.15);display:none
}
#bkfill{height:100%;width:0;background:linear-gradient(90deg,#e05020,#ffd700);transition:width .04s linear}

/* Item tooltip */
#ttip{
  position:absolute;bottom:66px;left:50%;transform:translateX(-50%);
  background:var(--ui);border:1px solid var(--bdr);padding:3px 10px;border-radius:4px;
  font-size:14px;color:#fff;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none
}

/* Damage flash */
#dmg{position:absolute;inset:0;pointer-events:none;background:transparent;transition:background .25s}

/* Toast notification */
#toast{
  position:absolute;top:14%;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.2);
  padding:6px 16px;border-radius:20px;font-size:15px;color:#fff;white-space:nowrap;
  opacity:0;transition:opacity .35s;pointer-events:none
}

/* ── Screens ── */
.screen{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}

#death-scr{background:rgba(140,0,0,0.78);backdrop-filter:blur(5px)}
#death-scr h1{font-family:var(--pt);font-size:clamp(16px,4vw,38px);color:#fff;text-shadow:3px 3px #000;text-align:center}
#death-scr p{font-size:17px;color:rgba(255,255,255,0.8);font-family:monospace}

#pause-scr{background:rgba(0,0,0,0.65);backdrop-filter:blur(7px)}
#pause-scr h1{font-family:var(--pt);font-size:clamp(13px,4vw,30px);color:#fff;text-align:center}

.gbtn{
  font-family:var(--pt);font-size:clamp(7px,2vw,12px);padding:10px 22px;cursor:pointer;
  background:rgba(255,255,255,0.1);color:#fff;border:2px solid rgba(255,255,255,0.5);border-radius:4px;
  letter-spacing:1px;transition:background .15s,transform .1s;pointer-events:auto;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent
}
.gbtn:active{background:rgba(255,255,255,0.25);transform:scale(0.97)}
.gbtn.g{border-color:var(--green);color:#6abf6a}
.gbtn.g:active{background:rgba(61,143,61,0.3)}

/* ── Inventory Screen ── */
#inv-scr{background:rgba(0,0,0,0.87);backdrop-filter:blur(8px);pointer-events:auto;padding:8px;overflow-y:auto}
#inv-panel{
  background:rgba(14,14,14,0.97);border:1px solid rgba(255,255,255,0.18);border-radius:10px;
  padding:14px 16px;width:min(520px,99vw);max-height:96vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:12px
}
#inv-panel::-webkit-scrollbar{width:4px}
#inv-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.18);border-radius:3px}
#inv-panel h2{font-family:var(--pt);font-size:clamp(8px,2vw,12px);color:#fff;text-align:center;letter-spacing:2px}
.isec{display:flex;flex-direction:column;gap:5px}
.ilbl{font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:1px}
.sgrid{display:flex;flex-wrap:wrap;gap:3px}
.islot{
  width:44px;height:44px;border:1px solid rgba(255,255,255,0.22);border-radius:4px;
  background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;position:relative;
  transition:border-color .1s,background .1s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent
}
.islot:active{border-color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.1)}
.islot.sel{border-color:var(--gold);background:rgba(255,215,0,0.14)}
.islot .sc{position:absolute;bottom:2px;right:2px;font-size:9px;color:#fff;text-shadow:1px 1px 0 #000;font-family:monospace;pointer-events:none}

/* Crafting */
#craft-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
#cgrid-hold{display:flex;flex-direction:column;gap:3px}
.cgrow{display:flex;gap:3px}
.carrow{font-size:24px;color:rgba(255,255,255,0.55)}
#cresult{
  width:52px;height:52px;border:2px solid var(--gold);border-radius:6px;
  background:rgba(255,215,0,0.07);display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;position:relative;transition:background .15s,transform .1s;
  -webkit-tap-highlight-color:transparent
}
#cresult:active{background:rgba(255,215,0,0.25);transform:scale(1.06)}
#cresult.empty{border-color:rgba(255,255,255,0.2);cursor:default}
#cresult .sc{position:absolute;bottom:2px;right:3px;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000;font-family:monospace}
#craft-info{font-size:11px;color:rgba(255,255,255,0.3);text-align:center;font-family:monospace}

/* ═══════════════════════════════════════════════════════
   TOUCH CONTROLS  — LANDSCAPE / PUBG STYLE
   Left half:  Movement joystick (bottom-left)
   Right half: Swipe to look (whole right side of screen)
               + action buttons overlay on right side
═══════════════════════════════════════════════════════ */
#tui{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}

/* ── RIGHT HALF = full swipe zone for camera ── */
#cam-swipe{
  position:absolute;
  right:0;top:0;
  width:55%;height:100%;
  pointer-events:auto;
  /* subtle indicator */
  background:transparent;
}

/* ── Movement joystick — bottom LEFT ── */
#joy-zone{
  position:absolute;
  left:16px;bottom:70px;
  width:140px;height:140px;
  pointer-events:auto;
}
#joy-base{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.25);
}
#joy-nub{
  position:absolute;width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,0.28);
  border:2px solid rgba(255,255,255,0.6);
  left:44px;top:44px;
  pointer-events:none;
}
#joy-lbl{
  position:absolute;bottom:-18px;width:100%;text-align:center;
  font-size:9px;color:rgba(255,255,255,0.35);font-family:monospace;pointer-events:none
}

/* ── Action buttons — RIGHT side, middle area ── */
/* These sit ON TOP of the cam-swipe zone */
#apad{
  position:absolute;
  right:12px;bottom:70px;
  width:210px;height:220px;
  pointer-events:none; /* children get events */
}
.tbtn{
  position:absolute;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;border:2px solid rgba(255,255,255,0.45);
  text-shadow:1px 1px 2px #000;
  user-select:none;-webkit-user-select:none;
  pointer-events:auto;cursor:pointer;
  font-family:monospace;font-weight:bold;
  -webkit-tap-highlight-color:transparent;
  transition:filter .06s,transform .06s;
}
.tbtn:active{filter:brightness(2.2);transform:scale(0.9)}

/* Layout (landscape):
   Jump      = top-right
   Attack    = top-left
   Place     = mid-right
   Break     = mid-left (hold)
   Look Up   = bottom-right
   Look Down = bottom-left
   Inventory = far left of pad
*/
#tj{width:62px;height:62px;background:rgba(40,180,40,0.65);  top:0;   right:0;  font-size:22px} /* Jump */
#ta{width:56px;height:56px;background:rgba(200,40,200,0.65); top:8px; right:72px;font-size:19px}/* Attack */
#tp{width:56px;height:56px;background:rgba(40,90,220,0.65);  top:84px;right:0;  font-size:18px}/* Place */
#tb{width:56px;height:56px;background:rgba(220,55,55,0.65);  top:84px;right:72px;font-size:18px}/* Break */
#tlu{width:46px;height:46px;background:rgba(80,80,180,0.6);  top:154px;right:0;  font-size:16px}/* Look Up */
#tld{width:46px;height:46px;background:rgba(80,80,180,0.6);  top:154px;right:58px;font-size:16px}/* Look Down */
#ti{width:46px;height:46px;background:rgba(180,120,20,0.65); top:154px;right:120px;font-size:16px}/* Inv */

/* Mobile small screen adjustments */
@media(max-height:420px){
  #joy-zone{width:120px;height:120px;left:10px;bottom:60px}
  #joy-nub{width:44px;height:44px;left:38px;top:38px}
  #apad{right:8px;bottom:58px;width:190px;height:200px}
  #tj{width:56px;height:56px}
  #ta,#tp,#tb{width:50px;height:50px;font-size:17px}
  #tlu,#tld,#ti{width:42px;height:42px;font-size:15px}
  #hotbar{bottom:6px}.hslot{width:42px;height:42px;font-size:19px}
  #bars{top:6px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Loading -->
<div id="loading">
  <h1>⛏ VoxelCraft</h1>
  <div id="load-bar-outer"><div id="load-bar"></div></div>
  <p id="load-msg">Initializing world…</p>
</div>

<!-- HUD -->
<div id="hud">
  <div id="xhair"></div>
  <div id="dbg"></div>
  <div id="time-hud"><span id="t-icon">☀️</span><span id="t-lbl">Day</span></div>
  <div id="bars"><div id="hp-row"></div></div>
  <div id="hotbar"></div>
  <div id="bkwrap"><div id="bkfill"></div></div>
  <div id="ttip"></div>
  <div id="dmg"></div>
  <div id="toast"></div>
</div>

<!-- Death Screen -->
<div id="death-scr" class="screen">
  <h1>💀 You Died!</h1>
  <p id="death-msg">Slain by a zombie</p>
  <button class="gbtn g" id="btn-resp">Respawn</button>
</div>

<!-- Pause Screen -->
<div id="pause-scr" class="screen">
  <h1>⏸ Paused</h1>
  <p style="font-size:13px;color:#aaa;font-family:monospace">Tap Resume to continue</p>
  <button class="gbtn g" id="btn-resume">▶ Resume</button>
</div>

<!-- Inventory -->
<div id="inv-scr" class="screen">
  <div id="inv-panel">
    <h2>🎒 Inventory &amp; Crafting</h2>
    <div class="isec">
      <div class="ilbl">✦ Crafting</div>
      <div id="craft-wrap">
        <div id="cgrid-hold"></div>
        <div class="carrow">▶</div>
        <div id="cresult" class="empty"></div>
      </div>
      <div id="craft-info">Select an item then tap a crafting slot</div>
      <button class="gbtn" id="btn-craft-clear" style="align-self:center;font-size:9px;padding:5px 12px">Clear Grid</button>
    </div>
    <div class="isec">
      <div class="ilbl">✦ Inventory</div>
      <div id="inv-main" class="sgrid"></div>
    </div>
    <div class="isec">
      <div class="ilbl">✦ Hotbar</div>
      <div id="inv-hbar" class="sgrid"></div>
    </div>
    <button class="gbtn" id="btn-inv-close" style="align-self:center">Close [E]</button>
  </div>
</div>

<!-- ══ TOUCH UI — LANDSCAPE PUBG STYLE ══ -->
<div id="tui">
  <!-- Full right-half swipe zone for camera look -->
  <div id="cam-swipe"></div>

  <!-- Movement joystick LEFT -->
  <div id="joy-zone">
    <div id="joy-base"></div>
    <div id="joy-nub"></div>
    <div id="joy-lbl">MOVE</div>
  </div>

  <!-- Action buttons RIGHT -->
  <div id="apad">
    <div class="tbtn" id="tj">↑</div>
    <div class="tbtn" id="ta">⚔</div>
    <div class="tbtn" id="tp">🧱</div>
    <div class="tbtn" id="tb">⛏</div>
    <div class="tbtn" id="tlu">🔼</div>
    <div class="tbtn" id="tld">🔽</div>
    <div class="tbtn" id="ti">🎒</div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- SimplexNoise inline -->
<script>

<script src="script.js"></script>
</body>
</html>
